name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils de validation
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential python3 valgrind
      - name: Moteur, allocations et défauts volontaires
        run: python3 .testeur/tests/selftest.py /tmp/libft-selftest.json
      - name: Commande et diagnostics
        run: python3 .testeur/tests/test_cli.py
      - name: Paquet partageable et documentation
        run: python3 .testeur/tests/test_publication.py
